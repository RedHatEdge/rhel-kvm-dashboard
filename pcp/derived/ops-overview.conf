#
# Derived metrics for the "Hypervisor & VM Overview" Grafana dashboard.
# Computed by pmlogger at collection time; pmproxy 6.3.7 segfaults on
# series arithmetic in pmseries queries, so the dashboard reads these
# pre-computed values instead.
#
ops.host.cpu.util = 100 - (100 * rate(kernel.all.cpu.idle)) / hinv.ncpu
ops.host.cpu.util(oneline) = percentage of non-idle time across all CPUs
ops.host.mem.util = 100 * (mem.physmem - mem.util.available) / mem.physmem
ops.host.mem.util(oneline) = percentage of physical memory in use (excludes reclaimable cache)
ops.vm.cpu.util = (100 * rate(libvirt.domstats.cpu.time)) / libvirt.dominfo.vcpu.current
ops.vm.cpu.util(oneline) = per-VM CPU usage as a percentage of its allocated vCPUs
ops.vm.mem.util = 100 * libvirt.domstats.balloon.rss / libvirt.dominfo.memory.current
ops.vm.mem.util(oneline) = per-VM host RSS as a percentage of its allocated memory
# Aliases with stable series identity: pmdalibvirt's labels on libvirt.hv.*
# vary over time, and each label set becomes a separate pmseries series.
ops.host.vms.running = libvirt.hv.domains.active
ops.host.vms.running(oneline) = number of running VMs on this host
ops.host.vms.stopped = libvirt.hv.domains.inactive
ops.host.vms.stopped(oneline) = number of defined but not running VMs on this host
