# Expose the locally-added PCP config under /var/lib/pcp/config, the same way
# the pcp packages link their own files (see /usr/lib/tmpfiles.d/pcp*.conf).
d  /var/lib/pcp/config/pmlogconf/ops            0755 root root -
L+ /var/lib/pcp/config/pmlogconf/ops/overview   - - - - ../../../../../../etc/pcp/pmlogconf/ops/overview
L+ /var/lib/pcp/config/derived/ops-overview.conf - - - - ../../../../../etc/pcp/derived/ops-overview.conf
L+ /var/lib/pcp/pmdas/openmetrics/config.d/libvirt_vms.python - - - - ../../../../../../etc/pcp/openmetrics/libvirt_vms.python
L+ /var/lib/pcp/pmdas/openmetrics/config.d/pcp_hosts.python - - - - ../../../../../../etc/pcp/openmetrics/pcp_hosts.python
