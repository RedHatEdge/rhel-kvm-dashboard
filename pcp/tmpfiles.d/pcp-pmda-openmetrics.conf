# Override of /usr/lib/tmpfiles.d/pcp-pmda-openmetrics.conf (same name wins).
# Identical except the sample grafana/kepler/vllm .url sources are left out,
# so pmdaopenmetrics only runs our libvirt_vms scripted source and the stock
# pmlogconf "openmetrics/summary" group (which logs all of openmetrics.*)
# doesn't pull Grafana's internal metrics into the archives and Valkey.
# Re-check against the packaged file after pcp upgrades.
L+ /var/lib/pcp/pmdas/openmetrics/Install - - - - ../../../../../usr/libexec/pcp/pmdas/openmetrics/Install
L+ /var/lib/pcp/pmdas/openmetrics/Remove - - - - ../../../../../usr/libexec/pcp/pmdas/openmetrics/Remove
L+ /var/lib/pcp/pmdas/openmetrics/Upgrade - - - - ../../../../../usr/libexec/pcp/pmdas/openmetrics/Upgrade
L+ /var/lib/pcp/pmdas/openmetrics/pmdaopenmetrics.python - - - - ../../../../../usr/libexec/pcp/pmdas/openmetrics/pmdaopenmetrics.python
